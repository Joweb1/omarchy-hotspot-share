<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hotspot Share · setup</title>
<meta name="theme-color" content="#0e0e14">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 15V3"/><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/></symbol>
  <symbol id="i-shield" viewBox="0 0 24 24"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/></symbol>
  <symbol id="i-wifi" viewBox="0 0 24 24"><path d="M12 20h.01"/><path d="M2 8.82a15 15 0 0 1 20 0"/><path d="M5 12.859a10 10 0 0 1 14 0"/><path d="M8.5 16.429a5 5 0 0 1 7 0"/></symbol>
</svg>
<div class="wrap">
  <header class="top"><div class="brand"><span class="prompt">❯</span> hotspot-share<span class="cursor"></span></div><div class="pill" data-s="wait"><i class="dot"></i><span>setup</span></div></header>
  <div class="steps">
    <a class="step" href="/ca.crt"><div class="badge"><svg class="ic"><use href="#i-download"/></svg></div><div><div class="n">01</div>Download certificate</div></a>
    <div class="step"><div class="badge"><svg class="ic"><use href="#i-shield"/></svg></div><div><div class="n">02</div>Install it<code>Settings → Security → Encryption &amp; credentials → Install a certificate → CA certificate</code></div></div>
    <a class="step" id="open" href="#"><div class="badge"><svg class="ic"><use href="#i-wifi"/></svg></div><div><div class="n">03</div>Open the app<code id="open-url"></code></div></a>
  </div>
</div>
<script>
  const host = location.hostname;
  const url = 'https://' + host + ':8443';
  document.getElementById('open').href = url;
  document.getElementById('open-url').textContent = url;
</script>
</body>
</html>
